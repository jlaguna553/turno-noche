<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#07080a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TURNO NOCHE" />
    <meta name="color-scheme" content="dark" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
    <meta
      name="description"
      content="TURNO NOCHE: juego de terror en primera persona. Estación de bombeo Sector 07, 03:47. Se juega en el navegador, se instala como app y funciona sin conexión."
    />
    <title>TURNO NOCHE // SECTOR 07</title>
    <style>
      html,
      body {
        margin: 0;
        background: #07080a;
        color: #cfc7b8;
      }
      #boot-splash {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        font: 600 13px/1.6 ui-monospace, 'Courier New', monospace;
        letter-spacing: 0.34em;
        text-transform: uppercase;
        color: #6f6a5e;
        background: radial-gradient(circle at 50% 46%, #101215 0%, #07080a 62%, #030405 100%);
      }
      #boot-splash span {
        animation: boot-pulse 1.8s ease-in-out infinite;
      }
      @keyframes boot-pulse {
        0%,
        100% {
          opacity: 0.32;
        }
        50% {
          opacity: 0.9;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot-splash"><span>Encendiendo generador</span></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
